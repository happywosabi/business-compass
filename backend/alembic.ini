# Alembic：管理数据库表结构的变更（迁移）。
# 常用命令（在 backend 目录下）：
#   uv run alembic upgrade head                          把数据库升级到最新结构
#   uv run alembic revision --autogenerate -m "说明"      修改 app/db/models.py 后生成迁移文件
# 数据库地址来自 .env，见 app/db/migrations/env.py

[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
