version: 1
parameters:
- key: fruit.revenue_basis
  label: 收入录入方式
  unit: null
  stage: basic
  ask: 营业额或笔数×客单价？
  three_tier: false
- key: fruit.sales_amount
  label: 营业额原始金额
  unit: 元
  stage: basic
  ask: 日营业额或月营业额多少？
  three_tier: true
- key: fruit.sales_period
  label: 营业额周期
  unit: null
  stage: basic
  ask: 这是每天还是每月的营业额？
  three_tier: false
- key: fruit.daily_transactions
  label: 日均交易笔数
  unit: 笔/天
  stage: basic
  ask: 每天多少笔交易？不是水果重量。
  three_tier: true
- key: fruit.avg_ticket
  label: 每笔客单价
  unit: 元/笔
  stage: basic
  ask: 每笔平均消费多少？元/斤不是客单价。
  three_tier: true
- key: fruit.open_days
  label: 每月营业天数
  unit: 天
  stage: basic
  ask: 每月开门多少天？
  three_tier: false
- key: fruit.cost_basis
  label: 采购成本口径
  unit: null
  stage: product
  ask: 填写未损耗毛利率+损耗，还是已含损耗综合采购成本率？
  three_tier: false
- key: fruit.gross_margin
  label: 未损耗毛利率
  unit: 比例
  stage: product
  ask: 售价减进价后占售价的比例？加价率不能直接当毛利率。
  three_tier: true
- key: fruit.loss_rate
  label: 采购成本加权损耗率
  unit: 比例
  stage: product
  ask: 未损耗口径下，按采购成本加权损耗多少？不是按重量或营业额。
  three_tier: true
- key: fruit.procurement_ratio
  label: 含损耗综合采购成本率
  unit: 比例
  stage: product
  ask: 包含损耗的销售对应采购成本占销售额多少？不是当月采购付款率。
  three_tier: true
- key: fruit.packaging_rate
  label: 包装成本率
  unit: 比例
  stage: costs
  ask: 包装费用占营业额多少？没有填0。
  three_tier: false
- key: fruit.channel_rate
  label: 渠道综合费用率
  unit: 比例
  stage: costs
  ask: 加权平台佣金占营业额多少？没有填0。
  three_tier: false
- key: fruit.payment_tax_rate
  label: 支付及税费率
  unit: 比例
  stage: costs
  ask: 确认支付及税费合计占营业额比例，没有填0，不套行业税率。
  three_tier: false
- key: fruit.rent
  label: 房租及物业
  unit: 元/月
  stage: costs
  ask: 每月房租和物业多少？
  three_tier: true
- key: fruit.staff_cost
  label: 付薪人员总成本
  unit: 元/月
  stage: costs
  ask: 每月付薪人员总成本？不含单列的老板工资；家人不付薪请确认0。
  three_tier: true
- key: fruit.owner_salary
  label: 老板劳动报酬
  unit: 元/月
  stage: costs
  ask: 每月给自己的劳动报酬多少？
  three_tier: true
- key: fruit.utilities
  label: 水电含冷藏电费
  unit: 元/月
  stage: costs
  ask: 每月水电多少？包含冷柜电费。
  three_tier: true
- key: fruit.delivery_fixed
  label: 固定配送费用
  unit: 元/月
  stage: costs
  ask: 每月固定配送费用？已计渠道费用的勿重复。
  three_tier: false
- key: fruit.other_fixed
  label: 其他固定支出
  unit: 元/月
  stage: costs
  ask: 其他每月固定费用多少？没有填0。
  three_tier: false
- key: fruit.renovation
  label: 装修投入
  unit: 元
  stage: shop
  ask: 筹备装修花多少？经营中仅记录历史金额。
  three_tier: false
- key: fruit.equipment
  label: 冷柜、货架、电子秤等设备
  unit: 元
  stage: shop
  ask: 设备投入多少？经营中仅记录历史金额。
  three_tier: false
- key: fruit.deposit
  label: 押金
  unit: 元
  stage: shop
  ask: 实际押金金额多少？经营中仅作历史记录。
  three_tier: false
- key: fruit.stock
  label: 库存进货成本金额
  unit: 元
  stage: shop
  ask: 筹备首批备货或当前库存进货成本多少？不是售价。
  three_tier: false
- key: fruit.stocking_days
  label: 备货天数
  unit: 天
  stage: shop
  ask: 通常准备几天的货？
  three_tier: false
- key: fruit.available_cash
  label: 可用于本店的现金
  unit: 元
  stage: none
  ask: null
  three_tier: false
- key: fruit.area_sqm
  label: 门店面积
  unit: ㎡
  stage: none
  ask: null
  three_tier: false
- key: fruit.location
  label: 门店位置
  unit: null
  stage: none
  ask: null
  three_tier: false
- key: fruit.channels
  label: 销售渠道
  unit: null
  stage: none
  ask: null
  three_tier: false
- key: fruit.public_facts
  label: 对外商品与活动资料
  unit: null
  stage: none
  ask: null
  three_tier: false
