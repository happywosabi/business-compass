# 实体小店各业态的默认值
#
# ！！注意：以下数值均为占位估计，尚未核实来源。上线前需逐项核实，
#          见 docs/实体小店测算模型.md 第十节"待补充"。
#
# params：  直接使用的默认值。可以写一个值（作为中性值），
#           也可以写 {base: ..., pessimistic: ..., optimistic: ...}
# derived： 按其他参数推算的默认值，如按单成本 = 客单价 × 成本率
# notes：   写入参数说明，告诉用户这个默认值是怎么来的
# traffic： 客流估算的默认值（用户不知道进店率、成交率时使用）
#
# 没有默认值、必须问用户的参数：客单价、日均单量、房租、装修、设备、老板工资
# 开业月份没有固定默认值，由代码按当前日期推后两个月估算

industries:
  drinks:
    label: 饮品
    params:
      startup.transfer_fee: 0
      startup.licenses: 5000
      startup.opening_marketing: 10000
      startup.renovation_months: 1
      startup.rent_free_months: 0
      startup.deposit_months: 2
      startup.initial_stock: 10000
      revenue.open_days: 30
      revenue.channels:
        - {name: 堂食/自提, share: 0.7, fee_rate: 0}
        - {name: 外卖, share: 0.3, fee_rate: 0.18}
      revenue.ramp: [0.5, 0.65, 0.8, 0.9]
      # 1 月 … 12 月，平均值必须为 1
      revenue.seasonality: [0.85, 0.80, 0.90, 1.00, 1.05, 1.15, 1.25, 1.25, 1.05, 1.00, 0.85, 0.85]
      variable_cost.payment_fee_rate: 0.006
      variable_cost.tax_rate: 0.02
      fixed_cost.rent_increase_rate: 0.05
      fixed_cost.rent_increase_every_years: 2
      fixed_cost.staff:
        - {role: 店员, count: 2, monthly_cost: 5000}
      fixed_cost.utilities: 3000
      fixed_cost.other_fixed: 1000
      store.lease_months: 36
    derived:
      variable_cost.unit_cost: {ratio_of: revenue.avg_ticket, ratio: 0.36}
    notes:
      startup.transfer_fee: 默认按没有转让费计算，需向房东或原租户核实
      revenue.seasonality: 饮品夏季高、冬季低；学校旁的店受寒暑假影响很大，需单独调整（待补充）
      fixed_cost.staff: 按 2 名店员、每人每月 5000 元估算，各城市工资水平差别较大，需核实
      variable_cost.tax_rate: 按小规模纳税人估算，以当地实际为准
    traffic:
      entry_rate: {pessimistic: 0.03, base: 0.05, optimistic: 0.08}
      conversion_rate: {pessimistic: 0.6, base: 0.7, optimistic: 0.8}
      day_factor: {pessimistic: 5, base: 6, optimistic: 7}
      delivery_share: {pessimistic: 0.5, base: 0.4, optimistic: 0.3}
