[project]
name = "business-compass-backend"
version = "0.1.0"
description = "商业罗盘后端"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
# 这是一个应用，不需要打包安装
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # 中文注释和提示文字较长，不按行宽报错（代码格式由 ruff format 负责）
    "UP046",  # Pydantic 泛型模型沿用文档中最常见的 Generic[T] 写法
]
