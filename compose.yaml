# 商业罗盘：Docker Compose 部署
#
# 常用命令（在项目根目录）：
#   docker compose up -d --build      构建并启动全部服务
#   docker compose ps                 查看状态
#   docker compose logs -f api        查看后端日志
#   docker compose down               停止（数据库数据保留在 pgdata 数据卷里）
#
# 配置来自项目根目录的 .env（参照 .env.example）。
# 只有 nginx 对外开放端口，其余服务只在 Docker 内部网络里互相访问。

name: business-compass

services:
  db:
    # 官方 PostgreSQL 加上 pgvector 扩展（后续热点去重、案例库检索要用）
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy

  nginx:
    # 先用 Node 把前端网页打包，再放进 Nginx 镜像（见 frontend/Dockerfile）
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      # 配置文件从外面挂进去：改了配置只要 docker compose restart nginx，不用重新构建
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
