# Nginx：对外的唯一入口
#   /api/...  转发给后端（api 容器）
#   其他      静态网页（目前是临时测试页，以后换成正式前端）
#
# 目前只监听 HTTP。上线前需要配置 HTTPS（证书），见 docs/代码结构.md。

# 登录、注册等接口按 IP 限流：平均每分钟 10 次，允许连续突发 10 次
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # 转发给后端时带上真实的访问者信息。Nginx 是最外层，直接用 $remote_addr 覆盖，
    # 防止访问者自己伪造 X-Forwarded-For
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location ~ ^/api/auth/(register|login|verify-email|resend-verification|forgot-password|reset-password|change-password)$ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api:8000;
    }

    location /api/ {
        # 关闭缓冲：以后 AI 回复用流式输出（SSE），需要逐字转发
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://api:8000;
    }

    root /usr/share/nginx/html;

    location / {
        # /verify-email 对应 verify-email.html
        try_files $uri $uri.html $uri/ =404;
    }
}
