# Nginx：对外的唯一入口
#   /api/...  转发给后端（api 容器）
#   其他      前端网页（frontend 打包后放在镜像里的 /usr/share/nginx/html）
#
# 本机/内部HTTP。生产由Caddy终止TLS，见docs/部署与验收.md。

# 登录、注册等接口按 IP 限流：平均每分钟 10 次，允许连续突发 10 次
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=calculation:10m rate=30r/m;
limit_req_status 429;
include /etc/nginx/proxy-trust/*.conf;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    # 压缩网页文件，手机上打开更快（接口返回不压缩，以后流式输出需要逐字转发）
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 注意：某个 location 里一旦写了 add_header，就不再继承这里的 add_header，
    # 所以下面几个 location 里会重复写这几行
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # 只接受受控代理的真实IP（生产挂载proxy-trust配置），其余请求使用连接来源IP。
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location ~ ^/api/auth/(register|login|verify-email|resend-verification|forgot-password|reset-password|change-password)$ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api:8000;
    }

    location /api/ {
        # 关闭缓冲：以后 AI 回复用流式输出（SSE），需要逐字转发
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://api:8000;
    }

    location ~ ^/api/profiles/[^/]+/(evaluations|what-if(?:/apply)?)$ {
        limit_req zone=calculation burst=5 nodelay;
        proxy_pass http://api:8000;
    }

    root /usr/share/nginx/html;

    # 打包出的 js、css、字体文件名里带内容哈希，内容变了文件名就变，可以长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # 单页应用：网页的各个路径（/login、/me、/verify-email……）都返回 index.html，由前端决定显示什么
    location / {
        try_files $uri /index.html;
    }

    # index.html 每次都向服务器确认是否有新版本，保证发布后用户拿到新网页
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        # 只允许加载本站的脚本和资源，降低被注入恶意脚本的风险
        # （/api/docs 接口文档要从外部加载脚本，所以这条规则只加在网页上，不加在 /api/ 上）
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
