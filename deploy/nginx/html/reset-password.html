<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>重置密码 - 商业罗盘</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>重置密码</h1>

  <!-- 没有令牌：填邮箱，申请重置链接 -->
  <form id="forgot-form" class="hidden">
    <p class="hint">填写注册时用的邮箱，我们会发送一封重置密码的邮件。</p>
    <input name="email" type="email" placeholder="邮箱" autocomplete="email" required>
    <button type="submit">发送重置邮件</button>
  </form>

  <!-- 从邮件链接打开：设置新密码 -->
  <form id="reset-form" class="hidden">
    <input name="password" type="password" placeholder="新密码（至少 8 位）" autocomplete="new-password" minlength="8" required>
    <button type="submit">设置新密码</button>
  </form>

  <p id="message" class="message"></p>
  <p><a href="/">返回首页</a></p>

  <script src="/app.js"></script>
  <script>
    const message = document.getElementById("message");
    const token = tokenFromUrl();
    const forgotForm = document.getElementById("forgot-form");
    const resetForm = document.getElementById("reset-form");
    (token ? resetForm : forgotForm).classList.remove("hidden");

    forgotForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const data = await api("/api/auth/forgot-password", { email: forgotForm.email.value });
        show(message, data.message, true);
      } catch (error) {
        show(message, error.message, false);
      }
    });

    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const data = await api("/api/auth/reset-password", {
          token, new_password: resetForm.password.value,
        });
        show(message, data.message, true);
        resetForm.classList.add("hidden");
      } catch (error) {
        show(message, error.message, false);
      }
    });
  </script>
</body>
</html>
