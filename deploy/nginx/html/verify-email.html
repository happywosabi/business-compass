<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>验证邮箱 - 商业罗盘</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>验证邮箱</h1>
  <p id="message" class="message">正在验证……</p>
  <p><a href="/">返回首页</a></p>

  <script src="/app.js"></script>
  <script>
    (async () => {
      const message = document.getElementById("message");
      const token = tokenFromUrl();
      if (!token) {
        show(message, "链接不完整，请从邮件中重新打开", false);
        return;
      }
      try {
        const data = await api("/api/auth/verify-email", { token });
        show(message, data.message, true);
      } catch (error) {
        show(message, error.message, false);
      }
    })();
  </script>
</body>
</html>
